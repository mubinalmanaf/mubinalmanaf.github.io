<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Film — Photography — Mubin Al-Manaf</title>
  <meta name="description" content="Film photography collection by Mubin Al-Manaf." />
  <meta name="author" content="Mubin Al-Manaf" />
  <link rel="canonical" href="https://mubinn.com/photography/film/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <script>document.documentElement.className += " js";</script>
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <a class="skip-link" href="#gallery">Skip to gallery</a>

  <header class="nav" id="nav">
    <div class="wrap nav__inner">
      <a class="nav__mark" href="../../" aria-label="Mubin Al-Manaf — home">
        <img src="../../Photo.jpeg" alt="Mubin Al-Manaf" class="nav__photo" />
        <span class="nav__mono">MA</span>
        <span class="nav__name">Mubin Al-Manaf</span>
      </a>
      <nav class="nav__links" aria-label="Primary">
        <a href="../../#about">About</a>
        <a href="../../#projects">Projects</a>
        <a href="../../#skills">Skills</a>
        <a href="../../#contact" class="nav__cta">Contact</a>
      </nav>
      <button class="nav__toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
        <span></span><span></span>
      </button>
    </div>
    <nav class="nav__mobile" id="mobileMenu" aria-label="Mobile">
      <a href="../../#about">About</a>
      <a href="../../#projects">Projects</a>
      <a href="../../#skills">Skills</a>
      <a href="../../#contact">Contact</a>
    </nav>
  </header>

  <main id="main">
    <section class="photography-hero" id="hero">
      <div class="wrap">
        <div class="photography-hero__content reveal">
          <p class="eyebrow"><a href="../" style="color: var(--text-dim); text-decoration: underline;">Photography</a></p>
          <h1 class="photography-hero__title">Film</h1>
          <p class="photography-hero__desc">A selection of film photography and analog work.</p>
        </div>
      </div>
    </section>

    <section class="section photography-gallery" id="gallery">
      <div class="wrap">
        <div class="gallery-grid" id="galleryGrid">
          <!-- Images will be populated here -->
        </div>
      </div>
    </section>

    <section class="section section--alt">
      <div class="wrap">
        <a href="../" class="btn btn--secondary">← Back to collections</a>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox__close" id="lightboxClose" aria-label="Close lightbox">&times;</button>
    <div class="lightbox__content">
      <img id="lightboxImage" src="" alt="" />
      <div class="lightbox__caption" id="lightboxCaption"></div>
    </div>
    <button class="lightbox__nav lightbox__prev" id="lightboxPrev" aria-label="Previous image">❮</button>
    <button class="lightbox__nav lightbox__next" id="lightboxNext" aria-label="Next image">❯</button>
  </div>

  <footer class="footer">
    <div class="wrap footer__inner">
      <span class="footer__mono">© <span id="year">2026</span> Mubin Al-Manaf</span>
      <span class="footer__mono footer__dim">Built &amp; hosted on GitHub Pages</span>
    </div>
  </footer>

  <script src="../../script.js"></script>
  <script>
    // Gallery initialization for Film collection
    (function() {
      'use strict';
      
      const photoDir = '../../Photos/Film/';
      const galleryGrid = document.getElementById('galleryGrid');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightboxImage');
      const lightboxCaption = document.getElementById('lightboxCaption');
      const lightboxClose = document.getElementById('lightboxClose');
      const lightboxPrev = document.getElementById('lightboxPrev');
      const lightboxNext = document.getElementById('lightboxNext');

      let images = [];
      let currentIndex = 0;

      const imageList = [
        'img078.jpg',
        'img094.jpg',
        'img112.jpg',
        'img122.jpg',
        'img124.jpg',
        'img134.jpg',
        'img145.jpg'
      ];

      function initGallery() {
        galleryGrid.innerHTML = '';
        images = imageList.map(filename => ({
          src: photoDir + filename,
          title: filename.replace(/\.(jpg|jpeg|png|gif)$/i, '')
        }));

        images.forEach((img, index) => {
          const item = document.createElement('div');
          item.className = 'gallery-item reveal';
          item.innerHTML = `<img src="${img.src}" alt="${img.title}" loading="lazy">`;
          item.addEventListener('click', () => openLightbox(index));
          galleryGrid.appendChild(item);
        });

        triggerRevealAnimation();
      }

      function openLightbox(index) {
        currentIndex = index;
        updateLightboxImage();
        lightbox.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('is-open');
        document.body.style.overflow = '';
      }

      function updateLightboxImage() {
        const img = images[currentIndex];
        lightboxImage.src = img.src;
        lightboxImage.alt = img.title;
        lightboxCaption.textContent = '';
      }

      function nextImage() {
        currentIndex = (currentIndex + 1) % images.length;
        updateLightboxImage();
      }

      function prevImage() {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        updateLightboxImage();
      }

      function triggerRevealAnimation() {
        if (!document.documentElement.classList.contains('js')) return;
        
        const reveals = document.querySelectorAll('.reveal');
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });

        reveals.forEach(el => observer.observe(el));
      }

      lightboxClose.addEventListener('click', closeLightbox);
      lightboxNext.addEventListener('click', nextImage);
      lightboxPrev.addEventListener('click', prevImage);

      document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('is-open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') nextImage();
        if (e.key === 'ArrowLeft') prevImage();
      });

      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      initGallery();
    })();
  </script>
</body>
</html>
